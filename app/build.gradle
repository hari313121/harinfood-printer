plugins {
    id 'com.android.application'
}

android {
    namespace 'id.my.mra.harinfoodprinter'
    compileSdk 34

    defaultConfig {
        applicationId "id.my.mra.harinfoodprinter"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
